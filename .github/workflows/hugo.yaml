
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Theme
        run: |
          mkdir -p themes/hugo-book
          curl -L https://github.com/alex-shpak/hugo-book/archive/refs/tags/v0.14.0.tar.gz | tar -xz -C themes/hugo-book --strip-components=1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Dart Sass
        run: |
          curl -fsSL https://github.com/sass/dart-sass/releases/download/1.108.2/dart-sass-1.108.2-linux-x64.tar.gz -o /tmp/dart-sass.tar.gz
          sudo tar -xzf /tmp/dart-sass.tar.gz -C /opt
          echo "/opt/dart-sass" >> "$GITHUB_PATH"
          /opt/dart-sass/sass --version

      - name: Build with Hugo
        run: hugo --themesDir themes

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    concurrency:
      group: github-pages
      queue: max

    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

<!-- Canonical -->
<link rel="canonical" href="{{ .Permalink }}">

<meta name="robots" content="index, follow">
<meta name="googlebot" content="max-image-preview:large">

<!-- OpenGraph -->
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ .Params.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ (index .Params.images 0) | absURL }}">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ .Title }}">
<meta name="twitter:description" content="{{ .Params.description }}">
<meta name="twitter:image" content="{{ (index .Params.images 0) | absURL }}">

<!-- 🌍 Hreflang mapping -->
{{ $langMap := dict
  "uk" "uk-UA"
  "en" "en"
  "pt" "pt-PT"
  "ru" "ru"
}}

<!-- Current page -->
<link rel="alternate"
      hreflang="{{ index $langMap .Language.Lang }}"
      href="{{ .Permalink }}">

<!-- Translations -->
{{ range .Translations }}
<link rel="alternate"
      hreflang="{{ index $langMap .Language.Lang }}"
      href="{{ .Permalink }}">
{{ end }}

<!-- 🌐 x-default (ставимо EN як глобальну) -->
{{ with .Site.GetPage (printf "/en%s" .RelPermalink) }}
<link rel="alternate" hreflang="x-default" href="{{ .Permalink }}">
{{ end }}

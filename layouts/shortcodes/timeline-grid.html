<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 20px;">
  {{ range sort (where .Site.RegularPages "Params.image" "!=" nil) "Params.event_date" "desc" }}
    <a href="{{ .RelPermalink }}" class="grid-item" style="text-decoration: none; color: inherit; transition: transform 0.2s;">
      <div style="aspect-ratio: 1/1; overflow: hidden; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); position: relative;">
        <img src="{{ .Params.image }}" alt="{{ .Title }}" style="width:100%; height:100%; object-fit: cover; display: block;" loading="lazy">
        <div style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 10px; color: white; font-size: 0.8rem;">
          <strong>{{ dateFormat "2006" .Params.event_date }}</strong> — {{ .Title }}
        </div>
      </div>
    </a>
  {{ end }}
</div>

<style>
  .grid-item:hover { transform: scale(1.03); }
</style>

backend:
  name: github
  repo: pivtorak-studio/pivtorak-studio.github.io
  branch: main

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "shield_ua"
    label: "Щит Нації (UA)"
    folder: "content/uk/docs/shield-of-nation"
    create: true
    fields:
      - {label: "Заголовок", name: "title", widget: "string"}
      - {label: "Вага (порядок)", name: "weight", widget: "number", default: 10}
      - {label: "Текст статті", name: "body", widget: "markdown"}

  - name: "shield_en"
    label: "Shield of Nation (EN)"
    folder: "content/en/docs/shield-of-nation"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Weight", name: "weight", widget: "number", default: 10}
      - {label: "Body", name: "body", widget: "markdown"}
